name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transport_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app/

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/transport_db
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "15"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          BCRYPT_COST_FACTOR: "4"
          SUPERADMIN_EMAIL: admin@system.local
          SUPERADMIN_PASSWORD: TestPassword123!
          SUPERADMIN_FIRST_NAME: Super
          SUPERADMIN_LAST_NAME: Admin
          APP_NAME: Transport Management System
          DEBUG: "true"
        run: python -m pytest tests/ -v --tb=short -p no:warnings

  frontend:
    name: Frontend — Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/admin-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build
