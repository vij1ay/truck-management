services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transport_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: apps/backend
      dockerfile: ../../infra/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - apps/backend/.env
    environment:
      # Override DATABASE_URL so backend resolves postgres by service name, not localhost
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/transport_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: apps/admin-frontend
      dockerfile: ../../infra/docker/Dockerfile.frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      - ./apps/admin-frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
