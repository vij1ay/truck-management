<h2 mat-dialog-title>Crop & Zoom</h2>

<mat-dialog-content class="crop-content">
    <image-cropper [imageFile]="data.imageFile" [maintainAspectRatio]="true" [aspectRatio]="aspectRatio"
        [roundCropper]="roundCropper" [transform]="transform" [resizeToWidth]="512" output="blob" format="png"
        (imageCropped)="onImageCropped($event)">
    </image-cropper>

    <div class="zoom-row">
        <mat-icon>zoom_out</mat-icon>
        <mat-slider min="1" max="3" step="0.1" discrete class="zoom-slider">
            <input matSliderThumb [value]="zoom" (valueChange)="onZoomChange($event)">
        </mat-slider>
        <mat-icon>zoom_in</mat-icon>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">{{ 'COMMON.CANCEL' | translate }}</button>
    <button mat-raised-button color="primary" [disabled]="!croppedBlob" (click)="onSave()">
        {{ 'COMMON.SAVE' | translate }}
    </button>
</mat-dialog-actions>
