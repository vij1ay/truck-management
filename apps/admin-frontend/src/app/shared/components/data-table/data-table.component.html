<div class="table-container mat-elevation-z2">

    <!-- Loading Shade overlay -->
    <div class="loading-shade" *ngIf="loading">
        <mat-icon class="spin-icon">autorenew</mat-icon>
    </div>

    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSort($event)" class="full-width-table">

        <!-- Dynamic Columns Generation -->
        <ng-container *ngFor="let col of columns" [matColumnDef]="col.def">

            <!-- Headers -->
            <ng-container *ngIf="col.sortable; else noSortHeader">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> {{ col.header | translate }} </th>
            </ng-container>
            <ng-template #noSortHeader>
                <th mat-header-cell *matHeaderCellDef> {{ col.header | translate }} </th>
            </ng-template>

            <!-- Cells -->
            <td mat-cell *matCellDef="let row">

                <!-- Standard Text formatting -->
                <ng-container *ngIf="!col.type || col.type === 'text'">
                    {{ row[col.def] || '-' }}
                </ng-container>

                <!-- Date formatting -->
                <ng-container *ngIf="col.type === 'date'">
                    {{ row[col.def] ? (row[col.def] | date:'medium') : '-' }}
                </ng-container>

                <!-- Badge (Use status badge dynamically via ng-content projection or wrapper logic) -->
                <!-- Since we are in the table, let's just emit raw or rely on parent projection, but fallback text for now -->
                <ng-container *ngIf="col.type === 'badge'">
                    <!-- Intentionally left open for extension, emitting standard text temporarily, ideally maps to app-status-badge -->
                    <span class="mock-badge">{{ row[col.def] }}</span>
                </ng-container>

            </td>
        </ng-container>

        <!-- Actions Column (Always pinned to extreme right if requested) -->
        <ng-container matColumnDef="actions" *ngIf="actions.length > 0">
            <th mat-header-cell *matHeaderCellDef class="actions-header"> {{ 'COMMON.ACTIONS' | translate }} </th>
            <td mat-cell *matCellDef="let row" class="actions-cell">
                <button mat-icon-button [matMenuTriggerFor]="actionMenu" aria-label="Row Actions">
                    <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #actionMenu="matMenu">
                    <ng-container *ngFor="let act of actions">
                        <button mat-menu-item (click)="onAction(act.action, row)"
                            *ngIf="!act.showIf || act.showIf(row)">
                            <mat-icon [color]="act.color">{{ act.icon }}</mat-icon>
                            <span>{{ act.label | translate }}</span>
                        </button>
                    </ng-container>
                </mat-menu>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="interactive-row"></tr>

        <!-- Null State -->
        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data-cell" [attr.colspan]="displayedColumns.length">
                {{ (loading ? 'COMMON.LOADING' : 'COMMON.NO_DATA') | translate }}
            </td>
        </tr>

    </table>

    <mat-paginator [length]="totalItems" [pageSize]="pageSize" [pageSizeOptions]="[10, 25, 50, 100]"
        [pageIndex]="pageIndex" (page)="onPage($event)" showFirstLastButtons>
    </mat-paginator>
</div>
