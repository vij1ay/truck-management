<div class="login-container">
    <mat-card class="login-card">
        <mat-card-header>
            <mat-card-title>Reset Password</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>New Password</mat-label>
                    <input matInput formControlName="new_password" type="password" autocomplete="new-password">
                    <mat-error *ngIf="form.get('new_password')?.hasError('required')">New password is required</mat-error>
                    <mat-error *ngIf="form.get('new_password')?.hasError('minlength')">
                        Must be at least 8 characters, with an uppercase letter, lowercase letter, and a digit.
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Confirm New Password</mat-label>
                    <input matInput formControlName="confirm_password" type="password" autocomplete="new-password">
                    <mat-error *ngIf="form.hasError('mismatch') && form.get('confirm_password')?.dirty">
                        Passwords do not match
                    </mat-error>
                </mat-form-field>

                <div class="form-actions">
                    <button mat-raised-button color="primary" type="submit" class="full-width"
                        [disabled]="form.invalid || isLoading() || !token">
                        <span *ngIf="!isLoading()">Reset Password</span>
                        <mat-spinner diameter="24" *ngIf="isLoading()"></mat-spinner>
                    </button>
                </div>
            </form>

            <div class="back-to-login">
                <a routerLink="/auth/login">Back to login</a>
            </div>
        </mat-card-content>
    </mat-card>
</div>
