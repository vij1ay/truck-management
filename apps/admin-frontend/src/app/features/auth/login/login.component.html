<div class="login-container">
    <mat-card class="login-card">
        <mat-card-header>
            <mat-card-title>{{ 'AUTH.LOGIN' | translate }}</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>{{ 'AUTH.EMAIL' | translate }}</mat-label>
                    <input matInput formControlName="email" type="email" placeholder="admin@system.local"
                        autocomplete="username">
                    <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
                    <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Please enter a valid email
                        address</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>{{ 'AUTH.PASSWORD' | translate }}</mat-label>
                    <input matInput formControlName="password" type="password" autocomplete="current-password">
                    <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
                </mat-form-field>

                <div class="form-actions">
                    <button mat-raised-button color="primary" type="submit" class="full-width"
                        [disabled]="loginForm.invalid || isLoading()">
                        <span *ngIf="!isLoading()">{{ 'AUTH.LOGIN' | translate }}</span>
                        <mat-spinner diameter="24" *ngIf="isLoading()"></mat-spinner>
                    </button>
                </div>

            </form>
        </mat-card-content>
    </mat-card>
</div>
