<h2 mat-dialog-title>
    {{ (isEditMode ? 'COMMON.EDIT' : 'COMMON.ADD_NEW') | translate }} Tenant
</h2>

<mat-dialog-content>
    <form [formGroup]="tenantForm" class="dialog-form">
        <h3 class="mat-subtitle-2 mb-2">Tenant Details</h3>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Company Name</mat-label>
            <input matInput formControlName="name" placeholder="e.g. Acme Logistics">
            <mat-error *ngIf="tenantForm.get('name')?.hasError('required')">Name is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Domain (Optional)</mat-label>
            <input matInput formControlName="domain" placeholder="e.g. acme.com">
        </mat-form-field>

        <div class="form-row">
            <mat-form-field appearance="outline" class="half-width">
                <mat-label>Subscription Tier</mat-label>
                <mat-select formControlName="subscription_tier">
                    <mat-option *ngFor="let t of tiers" [value]="t">{{ t | titlecase }}</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline" class="half-width">
                <mat-label>Max Users</mat-label>
                <input matInput type="number" formControlName="max_users" min="1">
            </mat-form-field>
        </div>

        <ng-container *ngIf="!isEditMode">
            <mat-divider class="my-3"></mat-divider>
            <h3 class="mat-subtitle-2 mb-2">Admin User Profile</h3>

            <div class="form-row">
                <mat-form-field appearance="outline" class="half-width">
                    <mat-label>First Name</mat-label>
                    <input matInput formControlName="admin_first_name">
                </mat-form-field>
                <mat-form-field appearance="outline" class="half-width">
                    <mat-label>Last Name</mat-label>
                    <input matInput formControlName="admin_last_name">
                </mat-form-field>
            </div>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Admin Email</mat-label>
                <input matInput type="email" formControlName="admin_email">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Initial Password</mat-label>
                <input matInput type="text" formControlName="admin_password">
            </mat-form-field>
        </ng-container>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close [disabled]="loading">{{ 'COMMON.CANCEL' | translate }}</button>
    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="tenantForm.invalid || loading">
        {{ (isEditMode ? 'COMMON.SAVE' : 'COMMON.ADD_NEW') | translate }}
    </button>
</mat-dialog-actions>
